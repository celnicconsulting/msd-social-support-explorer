  published data file, data/msd_platform_public.duckdb, is a trimmed extract of
  the conformed mart; it also carries META_DOWNLOAD_MANIFEST, which records the
  URL, size, checksum and download date of every upstream file listed below.
licence_status: >
  Every sourced dataset below was checked against its publisher on 2026-08-30.
  All 25 now carry a named licence, and every one is a clean attribution licence
  (CC BY 4.0 International, except the legacy Child, Youth and Family series,
  which is CC BY 3.0 New Zealand). No dataset is unverified.

  Each entry records licence_basis and licence_evidence. licence_basis
  "dataset_page" means the licence was read from this dataset's own page or its
  own data.govt.nz catalogue record; "agency_record" means only an
  agency-wide or site-wide statement was found, not one specific to this
  dataset; "unverified" means none could be established. licence_issue stays
  true wherever the basis is agency_record - the licence is very probably right,
  but it was inherited from a site-wide statement rather than asserted for this
  dataset in particular, and anyone redistributing should confirm it.

  None of the three publishers puts a licence statement in the body of its
  statistics pages; all three rely on a single site-wide copyright page. That is
  why data.govt.nz catalogue records, which carry an explicit licence_id per
  dataset, are the stronger evidence wherever one exists.
